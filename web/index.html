<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MultiCloud Platform</title>
  <style>
    /* -------------------------------------------------------
       Base reset & variables
    ------------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:    #2563eb;
      --blue-dk: #1d4ed8;
      --green:   #16a34a;
      --red:     #dc2626;
      --gray-1:  #f1f5f9;
      --gray-2:  #e2e8f0;
      --gray-5:  #64748b;
      --gray-9:  #0f172a;
      --radius:  8px;
    }
    body {
      font-family: system-ui, sans-serif;
      background: var(--gray-1);
      color: var(--gray-9);
      min-height: 100vh;
    }

    /* -------------------------------------------------------
       Top nav
    ------------------------------------------------------- */
    header {
      background: var(--blue);
      color: #fff;
      padding: 0 2rem;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    header span { opacity: .7; font-size: .85rem; }

    /* -------------------------------------------------------
       Layout
    ------------------------------------------------------- */
    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 1.5rem;
      padding: 1.5rem;
      max-width: 1280px;
      margin: 0 auto;
    }
    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
      aside { display: flex; flex-wrap: wrap; gap: .5rem; }
    }

    /* -------------------------------------------------------
       Sidebar
    ------------------------------------------------------- */
    aside { display: flex; flex-direction: column; gap: .5rem; }
    .nav-btn {
      background: #fff;
      border: 1.5px solid var(--gray-2);
      border-radius: var(--radius);
      padding: .65rem 1rem;
      font-size: .9rem;
      cursor: pointer;
      text-align: left;
      transition: background .15s;
    }
    .nav-btn:hover { background: var(--gray-1); }
    .nav-btn.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    /* -------------------------------------------------------
       Cards
    ------------------------------------------------------- */
    .card {
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--gray-2);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .card h2 { font-size: 1rem; margin-bottom: 1rem; color: var(--blue); }

    /* -------------------------------------------------------
       Forms & controls
    ------------------------------------------------------- */
    label { display: block; font-size: .85rem; color: var(--gray-5); margin-bottom: .25rem; }
    select, input[type="text"], input[type="file"] {
      width: 100%;
      padding: .5rem .75rem;
      border: 1.5px solid var(--gray-2);
      border-radius: var(--radius);
      font-size: .9rem;
      margin-bottom: .75rem;
      background: #fff;
    }
    button.btn {
      display: inline-block;
      padding: .5rem 1.25rem;
      border: none;
      border-radius: var(--radius);
      font-size: .9rem;
      cursor: pointer;
      font-weight: 600;
      transition: opacity .15s;
    }
    button.btn:hover { opacity: .85; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-danger  { background: var(--red);  color: #fff; }
    .btn-success { background: var(--green);color: #fff; }
    .btn-sm { padding: .3rem .75rem; font-size: .8rem; }

    /* -------------------------------------------------------
       Table
    ------------------------------------------------------- */
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th { text-align: left; padding: .5rem .75rem; background: var(--gray-1);
         color: var(--gray-5); font-weight: 600; border-bottom: 1px solid var(--gray-2); }
    td { padding: .5rem .75rem; border-bottom: 1px solid var(--gray-2); word-break: break-all; }
    tr:hover td { background: var(--gray-1); }

    /* -------------------------------------------------------
       Badges
    ------------------------------------------------------- */
    .badge {
      display: inline-block; padding: .15rem .55rem;
      border-radius: 99px; font-size: .75rem; font-weight: 700;
    }
    .badge-ok  { background: #dcfce7; color: #166534; }
    .badge-err { background: #fee2e2; color: #991b1b; }

    /* -------------------------------------------------------
       Toast notifications
    ------------------------------------------------------- */
    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: var(--gray-9); color: #fff;
      padding: .75rem 1.25rem; border-radius: var(--radius);
      font-size: .9rem; display: none; z-index: 999;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
    }
    #toast.show { display: block; }

    /* -------------------------------------------------------
       Quota bar
    ------------------------------------------------------- */
    .quota-bar { background: var(--gray-2); border-radius: 99px; height: 8px; margin: .5rem 0; }
    .quota-fill { height: 8px; border-radius: 99px; background: var(--blue); transition: width .4s; }

    /* -------------------------------------------------------
       Views
    ------------------------------------------------------- */
    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body>

<header>
  <h1>☁️ MultiCloud Platform</h1>
  <span>Prototype · Local Server</span>
</header>

<div class="layout">

  <!-- Sidebar navigation -->
  <aside>
    <button class="nav-btn active" onclick="showView('view-files',this)">📁 Files</button>
    <button class="nav-btn" onclick="showView('view-upload',this)">⬆️ Upload</button>
    <button class="nav-btn" onclick="showView('view-transfer',this)">🔄 Transfer</button>
    <button class="nav-btn" onclick="showView('view-history',this)">📋 History</button>
    <button class="nav-btn" onclick="showView('view-quota',this)">💾 Quota</button>
    <button class="nav-btn" onclick="showView('view-stats',this)">📊 Stats</button>
  </aside>

  <!-- Main area -->
  <main>

    <!-- ===================== FILES VIEW ===================== -->
    <div id="view-files" class="view active">
      <div class="card">
        <h2>Browse Files</h2>
        <label>Provider</label>
        <select id="files-provider"></select>
        <button class="btn btn-primary" onclick="loadFiles()">Refresh</button>
      </div>
      <div class="card">
        <table id="files-table">
          <thead>
            <tr>
              <th>Name</th><th>Size</th><th>Modified</th><th>ID</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="files-tbody">
            <tr><td colspan="5" style="color:var(--gray-5)">Select a provider and click Refresh.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ===================== UPLOAD VIEW ===================== -->
    <div id="view-upload" class="view">
      <div class="card">
        <h2>Upload File</h2>
        <label>Target Provider</label>
        <select id="upload-provider"></select>
        <label>Remote Path (e.g. /documents)</label>
        <input type="text" id="upload-path" value="/" />
        <label>File</label>
        <input type="file" id="upload-file" />
        <button class="btn btn-primary" onclick="uploadFile()">Upload</button>
      </div>
      <div id="upload-result"></div>
    </div>

    <!-- ===================== TRANSFER VIEW ===================== -->
    <div id="view-transfer" class="view">
      <div class="card">
        <h2>Copy / Move Between Providers</h2>
        <label>Operation</label>
        <select id="transfer-op">
          <option value="copy">Copy (keep original)</option>
          <option value="move">Move (delete original)</option>
        </select>
        <label>Source Provider</label>
        <select id="transfer-src"></select>
        <label>File ID</label>
        <input type="text" id="transfer-fileid" placeholder="Paste file ID from the Files view" />
        <label>Destination Provider</label>
        <select id="transfer-dst"></select>
        <label>Destination Path</label>
        <input type="text" id="transfer-path" value="/" />
        <button class="btn btn-success" onclick="doTransfer()">Execute Transfer</button>
      </div>
      <div id="transfer-result"></div>
    </div>

    <!-- ===================== HISTORY VIEW ===================== -->
    <div id="view-history" class="view">
      <div class="card">
        <h2>Transfer History</h2>
        <button class="btn btn-primary" onclick="loadHistory()">Refresh</button>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Time</th><th>Operation</th><th>File</th>
              <th>From</th><th>To</th><th>Status</th><th>Duration</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            <tr><td colspan="7" style="color:var(--gray-5)">Click Refresh to load history.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ===================== QUOTA VIEW ===================== -->
    <div id="view-quota" class="view">
      <div class="card">
        <h2>Storage Quota</h2>
        <button class="btn btn-primary" onclick="loadQuota()">Check All Providers</button>
      </div>
      <div id="quota-cards"></div>
    </div>

    <!-- ===================== STATS VIEW ===================== -->
    <div id="view-stats" class="view">
      <div class="card">
        <h2>Platform Statistics</h2>
        <button class="btn btn-primary" onclick="loadStats()">Refresh</button>
      </div>
      <div id="stats-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem"></div>
    </div>

  </main>
</div>

<div id="toast"></div>

<!-- ===================== JavaScript ===================== -->
<script>
  // ---------------------------------------------------------
  // Utility helpers
  // ---------------------------------------------------------
  const API = window.location.origin + "/api";

  /**
   * Show a toast notification for `ms` milliseconds.
   */
  function toast(msg, ms = 3000) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), ms);
  }

  /**
   * Generic fetch wrapper. Returns parsed JSON or null on error.
   */
  async function apiFetch(path, options = {}) {
    try {
      const res = await fetch(API + path, options);
      const data = await res.json();
      if (!res.ok) {
        toast("⚠️ " + (data.error || "Server error"));
        return null;
      }
      return data;
    } catch (err) {
      toast("🔌 Cannot reach server. Is server.py running?");
      return null;
    }
  }

  /**
   * Convert bytes to human-readable string.
   */
  function formatSize(bytes) {
    const units = ["B","KB","MB","GB","TB"];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(1) + " " + units[i];
  }

  // ---------------------------------------------------------
  // Navigation
  // ---------------------------------------------------------
  function showView(viewId, btn) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById(viewId).classList.add("active");
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }

  // ---------------------------------------------------------
  // Populate provider <select> elements on page load
  // ---------------------------------------------------------
  async function initProviders() {
    const data = await apiFetch("/providers");
    if (!data) return;
    const selects = ["files-provider","upload-provider","transfer-src","transfer-dst"];
    selects.forEach(id => {
      const sel = document.getElementById(id);
      sel.innerHTML = "";
      data.providers.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      });
    });
  }

  // ---------------------------------------------------------
  // FILES VIEW
  // ---------------------------------------------------------
  async function loadFiles() {
    const provider = document.getElementById("files-provider").value;
    const data = await apiFetch(`/files?provider=${encodeURIComponent(provider)}`);
    const tbody = document.getElementById("files-tbody");
    if (!data) return;
    if (data.files.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="color:var(--gray-5)">No files found.</td></tr>`;
      return;
    }
    tbody.innerHTML = data.files.map(f => `
      <tr>
        <td>${f.name}</td>
        <td>${formatSize(f.size)}</td>
        <td>${f.modified.slice(0,16).replace("T"," ")}</td>
        <td style="font-size:.75rem;color:var(--gray-5)">${f.file_id}</td>
        <td>
          <a href="${API}/download/${encodeURIComponent(provider)}/${f.file_id}"
             class="btn btn-primary btn-sm" download>⬇ DL</a>
          <button class="btn btn-danger btn-sm"
            onclick="deleteFile('${provider}','${f.file_id}')">🗑</button>
        </td>
      </tr>
    `).join("");
  }

  async function deleteFile(provider, fileId) {
    if (!confirm("Delete this file permanently?")) return;
    const data = await apiFetch(
      `/delete/${encodeURIComponent(provider)}/${fileId}`,
      { method: "DELETE" }
    );
    if (data) { toast("✅ " + data.message); loadFiles(); }
  }

  // ---------------------------------------------------------
  // UPLOAD VIEW
  // ---------------------------------------------------------
  async function uploadFile() {
    const provider = document.getElementById("upload-provider").value;
    const path     = document.getElementById("upload-path").value || "/";
    const fileEl   = document.getElementById("upload-file");
    if (!fileEl.files.length) { toast("Please choose a file."); return; }

    const formData = new FormData();
    formData.append("provider", provider);
    formData.append("path", path);
    formData.append("file", fileEl.files[0]);

    const data = await apiFetch("/upload", { method: "POST", body: formData });
    const resultEl = document.getElementById("upload-result");
    if (data) {
      toast("✅ Upload successful!");
      resultEl.innerHTML = `
        <div class="card" style="border-color:var(--green)">
          <strong>Uploaded:</strong> ${data.cloud_file.name}
          (${formatSize(data.cloud_file.size)})
          → ${data.cloud_file.provider} @ ${data.cloud_file.path}
        </div>`;
      fileEl.value = "";
    } else {
      resultEl.innerHTML = `<div class="card" style="border-color:var(--red)">Upload failed.</div>`;
    }
  }

  // ---------------------------------------------------------
  // TRANSFER VIEW
  // ---------------------------------------------------------
  async function doTransfer() {
    const body = {
      operation:   document.getElementById("transfer-op").value,
      source:      document.getElementById("transfer-src").value,
      destination: document.getElementById("transfer-dst").value,
      file_id:     document.getElementById("transfer-fileid").value.trim(),
      path:        document.getElementById("transfer-path").value || "/",
    };
    if (!body.file_id) { toast("Please enter a File ID."); return; }
    if (body.source === body.destination) {
      toast("Source and destination must differ."); return;
    }

    const data = await apiFetch("/transfer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    const resultEl = document.getElementById("transfer-result");
    if (data) {
      const ok = data.status === "success";
      toast(ok ? "✅ Transfer done!" : "❌ Transfer failed.");
      resultEl.innerHTML = `
        <div class="card" style="border-color:${ok ? "var(--green)" : "var(--red)"}">
          <strong>${data.operation.toUpperCase()}</strong> "${data.file_name}"
          <br/>${data.source} → ${data.destination}
          <br/>Status: <span class="badge ${ok ? "badge-ok" : "badge-err"}">${data.status}</span>
          &nbsp; ${data.duration_secs.toFixed(2)}s
          ${data.message ? "<br/>" + data.message : ""}
        </div>`;
    }
  }

  // ---------------------------------------------------------
  // HISTORY VIEW
  // ---------------------------------------------------------
  async function loadHistory() {
    const data = await apiFetch("/history?limit=50");
    if (!data) return;
    const tbody = document.getElementById("history-tbody");
    if (!data.history.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="color:var(--gray-5)">No transfers yet.</td></tr>`;
      return;
    }
    tbody.innerHTML = data.history.map(r => {
      const ok = r.status === "success";
      return `<tr>
        <td>${r.timestamp.slice(0,16).replace("T"," ")}</td>
        <td>${r.operation}</td>
        <td>${r.file_name}</td>
        <td>${r.source}</td>
        <td>${r.destination}</td>
        <td><span class="badge ${ok ? "badge-ok" : "badge-err"}">${r.status}</span></td>
        <td>${r.duration_secs.toFixed(2)}s</td>
      </tr>`;
    }).join("");
  }

  // ---------------------------------------------------------
  // QUOTA VIEW
  // ---------------------------------------------------------
  async function loadQuota() {
    const names = Array.from(document.getElementById("files-provider").options)
                       .map(o => o.value);
    const container = document.getElementById("quota-cards");
    container.innerHTML = "";

    for (const name of names) {
      const data = await apiFetch(`/quota?provider=${encodeURIComponent(name)}`);
      if (!data) continue;
      const pct = data.total > 0
        ? ((data.used / data.total) * 100).toFixed(1)
        : 0;
      container.innerHTML += `
        <div class="card">
          <h2>${name}</h2>
          <div class="quota-bar">
            <div class="quota-fill" style="width:${pct}%"></div>
          </div>
          <small>${formatSize(data.used)} used of ${formatSize(data.total)}
          (${pct}%)</small>
        </div>`;
    }
  }

  // ---------------------------------------------------------
  // STATS VIEW
  // ---------------------------------------------------------
  async function loadStats() {
    const data = await apiFetch("/stats");
    if (!data) return;
    const grid = document.getElementById("stats-grid");
    const items = [
      ["📁 Files Indexed",     data.total_files],
      ["🔄 Total Transfers",   data.total_transfers],
      ["✅ Successful",        data.successful_transfers],
      ["❌ Failed",            data.failed_transfers],
    ];
    grid.innerHTML = items.map(([label, val]) => `
      <div class="card" style="text-align:center">
        <div style="font-size:1.6rem;font-weight:700">${val}</div>
        <div style="font-size:.85rem;color:var(--gray-5)">${label}</div>
      </div>
    `).join("");
  }

  // ---------------------------------------------------------
  // Boot
  // ---------------------------------------------------------
  initProviders();
</script>
</body>
</html>
